<app-card>
    <h2>
        <h3 class="card-title">Datos del Paciente</h3>
    </h2>
    <div class="card-body">
        <form>
            <div class="form-group">
                <label for="nombre">RUT</label>
                <input type="text" id="rut" class="form-control" name="rut" required>
            </div>
            <div class="form-group">
                <label for="nombres">Nombres</label>
                <input type="text" id="apellido" class="form-control" name="nombres" required>
            </div>
            <div class="form-group">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" class="form-control" name="apellidos" required>
            </div>
            <div class="form-group">
                <label for="dni">Fecha Nacimiento</label>
                <input type="date" id="fecha_nacimiento" class="form-control" name="fecha_nacimiento" required>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" class="form-control" name="telefono" required>
            </div>
            <div class="form-group">
                <label for="apellidos">Dirección</label>
                <input type="text" id="direccion" class="form-control" name="direccion" required>
            </div>
            <div class="form-group">
                <label for="email">Sexo</label>
                <select id="sexo" class="form-control" name="sexo" required>
                    <option value="" disabled selected>Seleccione</option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                    <option value="otro">Otro</option>
                </select>
            </div>
            <button>
                <a routerLink="/resumen" class="btn btn-primary">Siguiente</a>
            </button>
        </form>
    </div>

</app-card>
